version: "3.9"

services:
  auth-admin:
    container_name: auth-admin
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_DOMAIN: ${VITE_DOMAIN:-https://sesc-it-team.ru}
      VITE_AUTH_DOMAIN: ${VITE_AUTH_DOMAIN:-https://auth.sesc-it-team.ru}
      VITE_AUTH_PATH: ${VITE_AUTH_PATH:-/auth}
      VITE_AUTH_CALLBACK_PATH: ${VITE_AUTH_CALLBACK_PATH:-/auth/callback}
      VITE_AUTH_SCOPES: ${VITE_AUTH_SCOPES:-openid profile email offline_access auth:users:read auth:users:create auth:users:update auth:users:delete}
      APP_DOMAIN: ${APP_DOMAIN:-admin.sesc-it-team.ru}

    networks:
      - traefik-public
      - logging

    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik-public"

      traefik.http.services.auth-admin.loadbalancer.server.port: "4173"

      traefik.http.routers.auth-admin.rule: "Host(`${APP_DOMAIN:-admin.sesc-it-team.ru}`)"
      traefik.http.routers.auth-admin.entrypoints: "websecure"
      traefik.http.routers.auth-admin.tls: "true"
      traefik.http.routers.auth-admin.tls.certresolver: "letsencrypt"
      traefik.http.routers.auth-admin.priority: "200"
      traefik.http.routers.auth-admin.service: "auth-admin"

      logging: "alloy"
      service: "lyceum-auth-admin-frontend"
      environment: "production"

networks:
  traefik-public:
    external: true
    name: traefik-public
  logging:
    external: true
    name: logging
